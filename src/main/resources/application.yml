spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: courier-delivery
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/courierdb}
    username: ${DB_USER:courier_app}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    defer-datasource-initialization: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  sql:
    init:
      mode: always
      data-locations: classpath:data.sql
      continue-on-error: true
server:
  error:
    include-message: always
    include-stacktrace: never
